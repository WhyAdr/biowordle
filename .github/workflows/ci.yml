name: BioWordle Scientific & Game-Balance CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies & Playwright Chromium
        run: |
          npm ci
          npm run pw:install:ci

      - name: Run Cross-Language Golden Vector & Runtime Invariant Suite (Node.js)
        run: node tests/verify_golden_and_dom.mjs

      - name: Run Playwright E2E suite on checked-out assets
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Install pinned RDKit & Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run build compiler & verify clean LF-normalized tracked diff
        run: |
          H_BEFORE=$(python -c "import json; print(json.load(open('data/puzzles.json'))['metadata']['dataset_version_hash'])")
          python build_puzzles.py
          H_AFTER=$(python -c "import json; print(json.load(open('data/puzzles.json'))['metadata']['dataset_version_hash'])")
          echo "dataset_version_hash before=$H_BEFORE after=$H_AFTER"
          test "$H_BEFORE" = "$H_AFTER"
          if ! git diff --exit-code data/puzzles.json data/puzzles_data.js tests/golden_feedback.json dist/biowordle_standalone.html; then
            CHANGED=$(git diff --name-only data/puzzles.json data/puzzles_data.js tests/golden_feedback.json dist/biowordle_standalone.html | tr '\n' ' ')
            SAMPLE=$(python -c "import subprocess; d=subprocess.check_output(['git','diff','-U1','data/puzzles.json','tests/golden_feedback.json'],text=True); print(' | '.join([l[:140] for l in d.splitlines()[:25]]))")
            echo "::error title=Tracked output diff ($CHANGED)::$SAMPLE"
            exit 1
          fi

      - name: Run Solver-Bot Difficulty & k-Anonymity Calibration Gates
        run: python tools/solver_bot.py

      - name: Run Python Scientific & Audit Unit Test Suite
        run: python -m unittest discover -v -s . -p "test_*.py"
