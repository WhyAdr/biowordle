name: BioWordle Scientific & Game-Balance CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies & Playwright Chromium
        run: |
          npm ci
          npm run pw:install:ci

      - name: Run Cross-Language Golden Vector & Runtime Invariant Suite (Node.js)
        run: node tests/verify_golden_and_dom.mjs

      - name: Run Playwright E2E suite on checked-out assets
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Install pinned RDKit & Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run build compiler & verify clean LF-normalized tracked diff
        run: |
          cp data/puzzles.json /tmp/puzzles_before.json
          cp data/puzzles_data.js /tmp/puzzles_data_before.js
          cp dist/biowordle_standalone.html /tmp/standalone_before.html
          H_BEFORE=$(python -c "import json; print(json.load(open('data/puzzles.json'))['metadata']['dataset_version_hash'])")
          python build_puzzles.py
          H_AFTER=$(python -c "import json; print(json.load(open('data/puzzles.json'))['metadata']['dataset_version_hash'])")
          echo "dataset_version_hash before=$H_BEFORE after=$H_AFTER"
          test "$H_BEFORE" = "$H_AFTER"
          git diff --exit-code tests/golden_feedback.json
          python - << 'PY'
          import hashlib, json
          from pathlib import Path

          before_map = {
              "data/puzzles.json": Path("/tmp/puzzles_before.json"),
              "data/puzzles_data.js": Path("/tmp/puzzles_data_before.js"),
              "dist/biowordle_standalone.html": Path("/tmp/standalone_before.html"),
          }
          for rel in ("data/puzzles.json", "data/puzzles_data.js", "tests/golden_feedback.json", "dist/biowordle_standalone.html"):
              raw_b = (before_map.get(rel, Path(rel))).read_bytes()
              raw_a = Path(rel).read_bytes()
              if b"\r" in raw_b or b"\r" in raw_a:
                  raise SystemExit(f"CRLF/CR detected in {rel}")

          before = json.loads(Path("/tmp/puzzles_before.json").read_text(encoding="utf-8"))
          after = json.loads(Path("data/puzzles.json").read_text(encoding="utf-8"))

          def strip_svgs(payload):
              out = json.loads(json.dumps(payload))
              svg_fields = {}
              for key in ("chemle", "seqle"):
                  for rec in out.get(key, []):
                      rec_id = rec.get("id") or rec.get("seq")
                      svg_fields[f"{key}:{rec_id}"] = {
                          f: rec.pop(f, None) for f in ("svg_full", "svg_scaffold", "svg_peptide", "svg_sha256")
                      }
              return out, svg_fields

          b_canon, b_svgs = strip_svgs(before)
          a_canon, a_svgs = strip_svgs(after)
          if b_canon != a_canon:
              diffs = [k for k in set(b_canon) | set(a_canon) if b_canon.get(k) != a_canon.get(k)]
              print(f"::error title=Canonical puzzles.json mismatch::Sections differed: {diffs}")
              raise SystemExit(1)

          for rec_key, vals in a_svgs.items():
              full_svg = vals.get("svg_full") or ""
              exp_sha = hashlib.sha256(full_svg.encode("utf-8")).hexdigest()[:12]
              if vals.get("svg_sha256") != exp_sha or "<svg" not in full_svg:
                  print(f"::error title=Invalid rebuilt SVG::{rec_key}")
                  raise SystemExit(1)

          svg_diffs = [k for k in b_svgs if b_svgs[k] != a_svgs[k]]
          print(f"Canonical non-SVG puzzles.json diff: 0 bytes; cross-host RDKit C++ SVG float/CoordGen diffs: {len(svg_diffs)} ({svg_diffs[:10]})")

          before_js = Path("/tmp/puzzles_data_before.js").read_text(encoding="utf-8")
          expected_before_js = "// Auto-generated by build_puzzles.py using RDKit — do not edit manually.\nwindow.BIOWORDLE_DATA = " + json.dumps(before, separators=(",", ":")) + ";\n"
          if before_js != expected_before_js:
              print("::error title=Stale puzzles_data.js::Checked-in data/puzzles_data.js does not match checked-in data/puzzles.json")
              raise SystemExit(1)

          html_src = Path("index.html").read_text(encoding="utf-8").replace("\r\n", "\n")
          css_src = Path("styles.css").read_text(encoding="utf-8").replace("\r\n", "\n")
          app_src = Path("app.js").read_text(encoding="utf-8").replace("\r\n", "\n")
          expected_standalone = html_src.replace(
              '<link rel="stylesheet" href="styles.css" />',
              f"<style>\n{css_src}\n</style>",
          ).replace(
              '<script src="data/puzzles_data.js"></script>\n  <script src="app.js"></script>',
              f"<script>\n{before_js}\n</script>\n<script>\n{app_src}\n</script>",
          )
          standalone_before = Path("/tmp/standalone_before.html").read_text(encoding="utf-8")
          if standalone_before != expected_standalone:
              print("::error title=Stale dist/biowordle_standalone.html::Checked-in standalone HTML does not match index.html + styles.css + data/puzzles_data.js + app.js")
              raise SystemExit(1)
          print("Tracked output parity & standalone source consistency PASSED.")
          PY

      - name: Run Solver-Bot Difficulty & k-Anonymity Calibration Gates
        run: python tools/solver_bot.py

      - name: Run Python Scientific & Audit Unit Test Suite
        run: python -m unittest discover -v -s . -p "test_*.py"
